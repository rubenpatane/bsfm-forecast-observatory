name: AGGIORNA
run-name: AGGIORNA · ${{ github.event_name }}
on:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: bsfm-aggiorna
  cancel-in-progress: false
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install BSFM and test dependencies
        run: python -m pip install -e . pytest
      - name: Install historical-source tooling
        run: sudo apt-get update && sudo apt-get install -y mdbtools unzip
      - name: Pre-update tests and registry integrity
        run: |
          pytest -q
          python -m bsfm.cli verify
      - name: Refresh current official public sources
        run: python -m bsfm.cli ingest
      - name: Refresh FAA SDR historical manifests 2010-current
        run: python -m bsfm.cli ingest-history
      - name: Download and extract official NTSB AVALL snapshot
        run: |
          rm -rf data/cache/ntsb data/derived/ntsb
          mkdir -p data/cache/ntsb data/derived/ntsb
          curl --fail --location --retry 3 --output data/cache/ntsb/avall.zip 'https://data.ntsb.gov/avdata/FileDirectory/DownloadFile?fileID=C%3A%5Cavdata%5Cavall.zip'
          unzip -o data/cache/ntsb/avall.zip -d data/cache/ntsb
          MDB=$(find data/cache/ntsb -type f -iname '*.mdb' -print -quit)
          test -n "$MDB"
          bash scripts/extract_ntsb.sh "$MDB" data/derived/ntsb
      - name: Normalize NTSB event-aircraft records conservatively
        run: |
          test -s data/derived/ntsb/events.csv
          test -s data/derived/ntsb/aircraft.csv
          test -s data/derived/ntsb/NTSB_Admin.csv
          python - <<'PY'
          import json
          from pathlib import Path
          from bsfm.ntsb import write_normalized
          d=Path('data/derived/ntsb')
          stats=write_normalized(d/'events.csv',d/'aircraft.csv',d/'events-normalized.jsonl',d/'Events_Sequence.csv',d/'Findings.csv',d/'NTSB_Admin.csv')
          print(json.dumps(stats,indent=2))
          assert stats['rows'] > 0
          assert stats['boeing_rows'] > 0
          assert stats['outcome_approval_known'] > 0
          PY
      - name: Post-update tests, registry and publication gate
        run: |
          pytest -q
          python -m bsfm.cli verify
          python -m bsfm.cli run
      - name: Evaluate model learning and promotion gate
        run: |
          python - <<'PY'
          import json
          from bsfm.pipeline import validate_sources
          from bsfm.model_lifecycle import update_model
          report_path='evaluations/backtest-report.json'
          try:
              with open(report_path) as f: report=json.load(f)
          except FileNotFoundError:
              report={}
          state=update_model(validate_sources(),report)
          print(json.dumps(state,indent=2))
          PY
      - name: Upload normalized NTSB research dataset
        uses: actions/upload-artifact@v4
        with:
          name: ntsb-derived
          path: data/derived/ntsb
          retention-days: 14
      - name: Commit auditable generated state when changed
        run: |
          if ! git diff --quiet -- site/data/status.json data/manifests forecasts evaluations; then
            git config user.name 'bsfm-observatory-bot'
            git config user.email 'bsfm-observatory-bot@users.noreply.github.com'
            git add site/data/status.json data/manifests forecasts evaluations
            git commit -m 'chore(observatory): AGGIORNA auditable state'
            git push
          fi
