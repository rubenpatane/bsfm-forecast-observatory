name: BSFM autonomous update
on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'
      timezone: 'Europe/Rome'
permissions:
  contents: write
concurrency:
  group: bsfm-autonomous-update
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
      - run: |
          python -m bsfm.cli verify
          python -m bsfm.cli run
      - name: Commit auditable state only when changed
        run: |
          if ! git diff --quiet; then
            git config user.name 'bsfm-observatory-bot'
            git config user.email 'bsfm-observatory-bot@users.noreply.github.com'
            git add site/data/status.json data/manifests forecasts evaluations
            git commit -m 'chore(observatory): autonomous state update'
            git push
          fi
