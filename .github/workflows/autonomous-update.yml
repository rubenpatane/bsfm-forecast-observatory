name: AGGIORNA
run-name: AGGIORNA · ${{ github.event_name }}
on:
  workflow_dispatch:
  schedule:
    - cron: '47 13 * * *'
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: bsfm-aggiorna
  cancel-in-progress: false
jobs:
  cadence:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 1}
      - name: Check four-day automatic cadence
        id: check
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Manual AGGIORNA: full run allowed."
            exit 0
          fi
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('data/manifests/auto-cadence.json')
          if not p.exists():
              print('run=true')
              raise SystemExit
          state=json.loads(p.read_text(encoding='utf-8'))
          last=datetime.fromisoformat(state['last_completed_refresh_at'].replace('Z','+00:00'))
          interval=int(state.get('interval_days',4))
          due=(datetime.now(timezone.utc)-last).total_seconds() >= interval*86400
          print('run=' + ('true' if due else 'false'))
          PY

  aggiorna:
    needs: cadence
    if: needs.cadence.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install BSFM and test dependencies
        run: python -m pip install -e . pytest
      - name: Install historical-source tooling
        run: sudo apt-get update && sudo apt-get install -y mdbtools unzip
      - name: Pre-update tests and registry integrity
        run: |
          pytest -q
          python -m bsfm.cli verify
          python -m bsfm.cli audit-foundation
      # ICAO API retrieval intentionally disabled. The trial allocation is exhausted/expired
      # and paid retrieval is not an operational dependency. Previously acquired evidence
      # remains historical provenance and may be reused subject to its licence.
      - name: Refresh current official public sources
        run: python -m bsfm.cli ingest
      - name: Refresh FAA SDR historical manifests 2010-current
        run: python -m bsfm.cli ingest-history
      - name: Download and extract official NTSB AVALL snapshot
        run: |
          rm -rf data/cache/ntsb data/derived/ntsb
          mkdir -p data/cache/ntsb data/derived/ntsb
          curl --fail --location --retry 3 --output data/cache/ntsb/avall.zip 'https://data.ntsb.gov/avdata/FileDirectory/DownloadFile?fileID=C%3A%5Cavdata%5Cavall.zip'
          unzip -o data/cache/ntsb/avall.zip -d data/cache/ntsb
          MDB=$(find data/cache/ntsb -type f -iname '*.mdb' -print -quit)
          test -n "$MDB"
          bash scripts/extract_ntsb.sh "$MDB" data/derived/ntsb
      - name: Normalize NTSB records and refresh public comparables
        run: |
          test -s data/derived/ntsb/events.csv
          test -s data/derived/ntsb/aircraft.csv
          test -s data/derived/ntsb/NTSB_Admin.csv
          python - <<'PY'
          import json
          from pathlib import Path
          from bsfm.ntsb import write_normalized
          from bsfm.comparables import write_public_comparables
          d=Path('data/derived/ntsb')
          normalized=d/'events-normalized.jsonl'
          stats=write_normalized(d/'events.csv',d/'aircraft.csv',normalized,d/'Events_Sequence.csv',d/'Findings.csv',d/'NTSB_Admin.csv')
          print(json.dumps(stats,indent=2))
          assert stats['rows'] > 0
          assert stats['boeing_rows'] > 0
          assert stats['outcome_approval_known'] > 0
          public_path=Path('site/data/real-data.json')
          public=json.loads(public_path.read_text(encoding='utf-8')) if public_path.exists() else {}
          public['ntsb_snapshot']={'source':'NTSB AVALL','scope':'Current official AVALL event-aircraft snapshot used as outcome evidence, not as a global census.',**stats}
          public_path.write_text(json.dumps(public,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          comparables=write_public_comparables(normalized)
          print(json.dumps({'public_comparables':len(comparables['cases'])},indent=2))
          PY
      - name: Post-update tests, registry and scientific audits
        run: |
          pytest -q
          python -m bsfm.cli verify
          python -m bsfm.cli run
          python -m bsfm.cli audit-foundation
          python -m bsfm.cli audit-final
          python scripts/audit_public_data_outcomes.py
          python scripts/audit_public_data_backtest.py --output evaluations/public-data-v1.3-exploratory-backtest.json
          python scripts/audit_public_data_backtest.py --output site/data/public-data-validation.json
      - name: Generate readiness, evidence inventory and public refinements
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          from bsfm.pipeline import validate_sources
          from bsfm.cli import availability_audit
          from bsfm.foundation_report import build_foundation_report
          from bsfm.model_lifecycle import update_model
          from bsfm.readiness import final_readiness
          from bsfm.evidence_automation import write_evidence_state
          from bsfm.refinements import write_public_refinements
          from bsfm.public_research import write_public_research_state
          from bsfm.public_forecast import write_public_forecast
          from bsfm.research_cycle import execute_repository_cycle
          root=Path('.')
          source=validate_sources()
          report=build_foundation_report(root,availability_audit(source))
          state=update_model(source,report)
          public=final_readiness(report,state)
          Path('site/data/final-readiness.json').write_text(json.dumps(public,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          evidence=write_evidence_state(root,public)
          parent=json.loads(Path('forecasts/F-002.json').read_text(encoding='utf-8'))
          refinements=write_public_refinements(root,parent)
          research=write_public_research_state(root)
          forecast=write_public_forecast(root)
          cycle=execute_repository_cycle(root,source,report)
          print(json.dumps({'foundation':report,'lifecycle':state,'public_readiness':public,'evidence_gaps':evidence['gaps'],'published_refinements':len(refinements),'public_research_years':len(research['gates']['G1']['years']),'public_forecast':forecast['forecast_id'],'research_cycle':cycle},indent=2))
          PY
      - name: Record successful scheduled refresh cadence
        if: github.event_name == 'schedule'
        run: |
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          p=Path('data/manifests/auto-cadence.json')
          state=json.loads(p.read_text(encoding='utf-8')) if p.exists() else {'schema':'bsfm.auto-cadence.v1','interval_days':4}
          state['last_completed_refresh_at']=datetime.now(timezone.utc).replace(microsecond=0).isoformat().replace('+00:00','Z')
          state['last_event']='schedule'
          state['last_run_id']='${{ github.run_id }}'
          p.parent.mkdir(parents=True,exist_ok=True)
          p.write_text(json.dumps(state,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          PY
      - name: Upload normalized NTSB research dataset
        uses: actions/upload-artifact@v4
        with:
          name: ntsb-derived
          path: data/derived/ntsb
          retention-days: 14
      - name: Commit auditable generated state when changed
        run: |
          if ! git diff --quiet -- site/data data/manifests forecasts evaluations; then
            git config user.name 'bsfm-observatory-bot'
            git config user.email 'bsfm-observatory-bot@users.noreply.github.com'
            git add site/data data/manifests forecasts evaluations
            git commit -m 'chore(observatory): AGGIORNA auditable state'
            for attempt in 1 2 3; do
              git fetch origin main
              if git rebase origin/main; then
                if git push origin HEAD:main; then break; fi
              else
                echo 'Generated-state rebase conflicted; refusing to overwrite concurrent changes.' >&2
                git rebase --abort || true; exit 1
              fi
              if [ "$attempt" -eq 3 ]; then echo 'main kept advancing; generated-state push failed after 3 safe retries.' >&2; exit 1; fi
              sleep $((attempt * 2))
            done
          fi
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with: {enablement: true}
      - name: Upload observatory site
        uses: actions/upload-pages-artifact@v3
        with: {path: site}
      - name: Deploy observatory site
        id: deployment
        uses: actions/deploy-pages@v4
