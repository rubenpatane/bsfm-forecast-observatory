name: Research CI

on:
  push:
    branches:
      - research/privacy-safe-rebuild-20260905

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install project and tests
        run: python -m pip install -e . pytest
      - name: Hide temporary research workflow from repository invariants
        run: mv .github/workflows/research-ci.yml /tmp/research-ci.yml
      - name: Full test suite
        run: pytest -q
      - name: Registry verification
        run: python -m bsfm.cli verify
      - name: Foundation audit
        run: python -m bsfm.cli audit-foundation
      - name: Final audit
        run: python -m bsfm.cli audit-final
