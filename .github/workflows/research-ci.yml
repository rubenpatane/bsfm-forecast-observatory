name: Temporary Research CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install project and test dependency
        run: python -m pip install -e . pytest
      - name: Remove temporary workflow from the read-only test worktree
        run: rm .github/workflows/research-ci.yml
      - name: Verify implementation and scientific fail-closed state
        run: |
          test "$(git hash-object forecasts/F-002.json)" = eb55a77210d2fd254483ff74c3d02fcd60c1f0ad
          pytest -q
          python -m bsfm.cli verify
          python -m bsfm.cli audit-foundation
          python -m bsfm.cli audit-final
