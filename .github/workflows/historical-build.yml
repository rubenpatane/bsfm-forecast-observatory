name: BSFM historical source build
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -e .
      - name: Build FAA SDR 2010-current manifests
        run: python -m bsfm.cli ingest-history
      - name: Verify forecast registry
        run: python -m bsfm.cli verify
      - name: Commit source manifests
        run: |
          if ! git diff --quiet; then
            git config user.name 'bsfm-observatory-bot'
            git config user.email 'bsfm-observatory-bot@users.noreply.github.com'
            git add data/manifests
            git commit -m 'data: refresh historical official-source manifests'
            git push
          fi
